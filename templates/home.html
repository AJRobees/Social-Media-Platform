<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    
    <link rel="stylesheet" href="{% static 'header.css' %}">
</head>

<!-- CSS block to change the apprearance of the page. -->
<style >

    a{
        text-decoration: none;
        color: inherit;
    }

    .home-content{
        border:steelblue ;
        border-style:solid;
        box-sizing: border-box;
        position:inherit;
        font-size: large;
        padding: 1% 8%;
        margin-top: 10px;
    }

    .message-container{
        position: inherit;
        padding: 0% 3%;
        margin-top: 10px;
        box-sizing: content-box;
        border: 2px double cadetblue;
        font-size: x-large;
    }
    
.profile-page {
    margin-left: 2%;
}

</style>

    
<body>
    <h1 class="page-title">Home {{user.username}}:</h1>

    <!-- These are for travel between pages. -->
    <div class="header">
        <span class="profile-page"><a href="{% url 'profile' %}">Profile</a></span>
        <span class="show-post" id="show-post"><a href="{% url 'posts' %}" >Posts</a></span>
        <span class="logout-option"><a href="{% url 'logout' %}">Logout</a></span>
        
    </div>

    <div class="message-container">
        {% if messages %}
            {% for message in messages %}
                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <div class="home-content">
        <!-- Leaving this area for adding the relation to the friends model to show the posts posted by friends. -->
        <p>
            This page will be available in the future update.
            <h4> Sorry for Inconvenient.</h4> Go to Posts page to view posts.
        </p>
    </div>
</body>
</html>
