<!DOCTYPE html>
{% load static %}         
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<style>
    
    .message-container{
        position: inherit;
        padding: 0% 3%;
        margin-top: 10px;
        box-sizing: content-box;
        border: 2px double cadetblue;
        font-size: medium;
    }
</style>

<body>
  <div class="login-card">
    <h2>Welcome</h2>
    <p class="subtitle">Login to your account</p>
    
    <div class="message-container">
      {% if messages %}
        {% for message in messages %}
            <div class="message {{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    </div>

    <!-- Login form  -->
    <form id="loginForm" method="post" action="">
      {% csrf_token %}

      <!-- Get the username and password from the user to authenticate with the database  -->
      <label for="username">Username</label>
      <input type="username" id="username" name="username" placeholder="Enter your username" required />

      <label for="password">Password</label>
      <div class="password-box">
        <input type="password" id="password" name="password" placeholder="Enter your password" required />
        <button type="button" id="togglePassword">Show</button>
      </div>

      <!--

      <div class="options">
        <label><input type="checkbox" name="remember" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      -->

      <button type="submit" class="login-btn">Login</button>

      <span class="sign-in-link"><a href="{% url 'register' %}"> Sign-in</a></span>

      <div id="message" class="message"></div>
    </form>
  </div>

  <!-- Javascript to show/hide the password  -->
  <script>
    const form = document.getElementById("loginForm");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const messageBox = document.getElementById("message");

    togglePassword.addEventListener("click", function () {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      togglePassword.textContent = isPassword ? "Hide" : "Show";
    });

  </script>
</body>
</html>
