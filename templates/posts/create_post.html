<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New post</title>
</head>
<link rel="stylesheet" href="{% static 'header.css' %}">
<link rel="stylesheet" href="{% static 'profile_layout.css' %}">

<!-- CSS block to change the apprearance of the page. -->
<style>

    *{
        font-family: 'Times New Roman', Times, serif;
    }

    a{
        text-decoration: none;
        color: inherit;
    }

    .create-post{
        position:inherit;
        padding: 3px 3px 3px 3px;
        border:ridge steelblue ;
        box-shadow: #414040;
        background-color: lightskyblue;
    }

    .post-panel{
        position:inherit;
        box-sizing: border-box;
        font-size: large;
        margin: 0% 5% 10px;
        margin-top: 10px;
    }

    
    .submit-btn{
        font-size: large;
        margin-left:5% ;
        margin-bottom: 10px;
    }

    .message-container{
        position: inherit;
        padding: 0% 3%;
        margin-top: 10px;
        box-sizing: content-box;
        border: 2px double cadetblue;
        font-size: x-large;
    }

</style>

<body>

    <!-- These are for travel between pages.-->
    <h1 class="page-title">New Post:</h1>
    <div class="header">
        <span class="home-page" id="home-page"><a href="{% url 'home' %}" >Home</a></span>
        <span class="show-post" id="show-post"><a href="{% url 'posts' %}" >🔙Back</a></span>
      
    </div>
    
    <div class="message-container">
      {% if messages %}
        {% for message in messages %}
            <div class="message {{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    </div>
    
    <p><h2> {{user.username}}'s' Post creation,</h2></p>

    <!-- "csrf_token" is an Django authentication method. 'Form' uses the fields that are need to get data
    from the user, 'Content' or 'post' only the required field others are can be empty based on the 
    user decision. 
    Using 'multipart/form-data' as an encription type, each field bundled into a seperate packages for 
    safe transport and that naturally divide the 'file' avoid to encrypt with 'text' type.

    'for' and 'name' must be the same as the one stored in the database.
    post_image is only allow the formats in the given types, other types are rejected.
    'submit-btn' submit the data to the views. -->

    <form class="create-post" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="post-panel" >
            <p><strong for="title">Title :</strong>
            <input name="title" id="title" type="text" maxlength="200" ></p>

            <p><strong for="post">Content *:</strong>
            <input name="post" id="post" type="text" maxlength="500" required></p>
            
            <p><strong for="post_image">Image:</strong>
            <input name="post_image" id="post_image" type="file" maxlength="255" accept=".png, .jpeg, .jpg"></p>

            <button type="submit" class="submit-btn"> Post </button>
        </div>

    </form>


</body>
</html>
